<!DOCTYPE html>
<html lang="en">
<head>
    <base target="_self">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMPROCESSER - Smart Travel Assistant</title>
    <meta name="description" content="Plan efficient and educational trips with AI-powered travel assistance">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#2563eb",
                        secondary: "#1e40af",
                        accent: "#3b82f6"
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Navigation Component
        const Navigation = ({ currentPage, setCurrentPage }) => {
            return (
                <nav className="bg-white shadow-sm border-b border-gray-200">
                    <div className="container mx-auto px-4">
                        <div className="flex justify-between items-center py-4">
                            <div className="flex items-center space-x-2">
                                <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                                    <span className="text-white font-bold text-sm">🧭</span>
                                </div>
                                <span className="text-xl font-bold text-gray-800">COMPROCESSER</span>
                            </div>
                            
                            <div className="hidden md:flex space-x-8">
                                <button 
                                    onClick={() => setCurrentPage('home')}
                                    className={`font-medium ${currentPage === 'home' ? 'text-blue-600' : 'text-gray-600 hover:text-blue-500'}`}
                                >
                                    Home
                                </button>
                                <button 
                                    onClick={() => setCurrentPage('exchange')}
                                    className={`font-medium ${currentPage === 'exchange' ? 'text-blue-600' : 'text-gray-600 hover:text-blue-500'}`}
                                >
                                    Exchange Rates
                                </button>
                                <button 
                                    onClick={() => setCurrentPage('planner')}
                                    className={`font-medium ${currentPage === 'planner' ? 'text-blue-600' : 'text-gray-600 hover:text-blue-500'}`}
                                >
                                    Trip Planner
                                </button>
                                <button 
                                    onClick={() => setCurrentPage('analyzer')}
                                    className={`font-medium ${currentPage === 'analyzer' ? 'text-blue-600' : 'text-gray-600 hover:text-blue-500'}`}
                                >
                                    Image Analyzer
                                </button>
                            </div>
                            
                            <button className="md:hidden text-gray-600">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </nav>
            );
        };

        // Footer Component
        const Footer = () => {
            return (
                <footer className="bg-white border-t border-gray-200 mt-12">
                    <div className="container mx-auto px-4 py-8">
                        <div className="flex flex-col md:flex-row justify-between items-center">
                            <div className="mb-4 md:mb-0">
                                <span className="text-gray-600">© 2024 COMPROCESSER</span>
                            </div>
                            <div className="text-gray-500">
                                <span className="font-medium">Team: </span>
                                <span>ChinoRusianoKoreano</span>
                            </div>
                            <div className="flex space-x-4 mt-4 md:mt-0">
                                <a href="#" className="text-gray-400 hover:text-blue-500">Privacy</a>
                                <a href="#" className="text-gray-400 hover:text-blue-500">Terms</a>
                                <a href="#" className="text-gray-400 hover:text-blue-500">Contact</a>
                            </div>
                        </div>
                    </div>
                </footer>
            );
        };

        // Home Page Component
        const HomePage = ({ setCurrentPage }) => {
            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-white">
                    <div className="container mx-auto px-4 py-12">
                        <div className="max-w-4xl mx-auto text-center">
                            <h1 className="text-4xl md:text-6xl font-bold text-gray-900 mb-6">
                                Smart Travel Planning
                                <span className="text-blue-600 block">Made Simple</span>
                            </h1>
                            <p className="text-xl text-gray-600 mb-8 leading-relaxed">
                                COMPROCESSER helps you plan efficient and educational trips by predicting exchange rate trends, 
                                suggesting optimized itineraries, and analyzing travel experiences with AI.
                            </p>
                            <div className="flex flex-col sm:flex-row gap-4 justify-center">
                                <button 
                                    onClick={() => setCurrentPage('planner')}
                                    className="bg-blue-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors shadow-lg"
                                >
                                    Start Planning Your Trip
                                </button>
                                <button 
                                    onClick={() => setCurrentPage('exchange')}
                                    className="border border-blue-600 text-blue-600 px-8 py-3 rounded-lg font-semibold hover:bg-blue-50 transition-colors"
                                >
                                    Check Exchange Rates
                                </button>
                            </div>
                        </div>
                        
                        <div className="grid md:grid-cols-3 gap-8 mt-16 max-w-6xl mx-auto">
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                                <div className="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center mb-4">
                                    <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1" />
                                    </svg>
                                </div>
                                <h3 className="text-xl font-semibold text-gray-900 mb-2">Exchange Rate Predictions</h3>
                                <p className="text-gray-600">Get AI-powered insights on currency trends for optimal travel budgeting.</p>
                            </div>
                            
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                                <div className="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center mb-4">
                                    <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
                                    </svg>
                                </div>
                                <h3 className="text-xl font-semibold text-gray-900 mb-2">Smart Itinerary Planning</h3>
                                <p className="text-gray-600">Create optimized travel plans based on your preferences and budget.</p>
                            </div>
                            
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                                <div className="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center mb-4">
                                    <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                                    </svg>
                                </div>
                                <h3 className="text-xl font-semibold text-gray-900 mb-2">Image Analysis</h3>
                                <p className="text-gray-600">Analyze travel photos for cultural insights and recommendations.</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Exchange Rate Page Component
        const ExchangeRatePage = () => {
            const [country, setCountry] = useState('');
            const [date, setDate] = useState('');
            const [prediction, setPrediction] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                // Mock prediction result
                setPrediction("Based on current trends, the exchange rate is predicted to be favorable for travel. Consider exchanging currency in the next 2 weeks for optimal rates.");
            };

            return (
                <div className="min-h-screen bg-white py-12">
                    <div className="container mx-auto px-4">
                        <div className="max-w-4xl mx-auto">
                            <h1 className="text-3xl font-bold text-gray-900 mb-2">Exchange Rate Predictions</h1>
                            <p className="text-gray-600 mb-8">Get AI-powered insights on currency exchange trends</p>
                            
                            <div className="grid md:grid-cols-2 gap-8">
                                <div className="bg-gray-50 p-6 rounded-xl border border-gray-200">
                                    <h2 className="text-xl font-semibold text-gray-900 mb-4">Check Rates</h2>
                                    <form onSubmit={handleSubmit} className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Country / Currency
                                            </label>
                                            <input
                                                type="text"
                                                value={country}
                                                onChange={(e) => setCountry(e.target.value)}
                                                placeholder="e.g., Japan, EUR, USD"
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Travel Date
                                            </label>
                                            <input
                                                type="date"
                                                value={date}
                                                onChange={(e) => setDate(e.target.value)}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                            />
                                        </div>
                                        <button
                                            type="submit"
                                            className="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors"
                                        >
                                            Get Prediction
                                        </button>
                                    </form>
                                    
                                    {prediction && (
                                        <div className="mt-6 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                                            <h3 className="font-semibold text-blue-900 mb-2">AI Prediction</h3>
                                            <p className="text-blue-800">{prediction}</p>
                                        </div>
                                    )}
                                </div>
                                
                                <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                                    <h2 className="text-xl font-semibold text-gray-900 mb-4">Exchange Rate Trends</h2>
                                    <div className="bg-gray-100 rounded-lg h-64 flex items-center justify-center">
                                        <div className="text-center text-gray-500">
                                            <svg className="w-12 h-12 mx-auto mb-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                                            </svg>
                                            <p>Exchange rate chart visualization</p>
                                            <p className="text-sm">(Live data integration placeholder)</p>
                                        </div>
                                    </div>
                                    <div className="mt-4 grid grid-cols-2 gap-4">
                                        <div className="text-center p-3 bg-green-50 rounded-lg">
                                            <div className="text-2xl font-bold text-green-600">145.2</div>
                                            <div className="text-sm text-green-800">JPY/USD</div>
                                        </div>
                                        <div className="text-center p-3 bg-blue-50 rounded-lg">
                                            <div className="text-2xl font-bold text-blue-600">0.85</div>
                                            <div className="text-sm text-blue-800">EUR/USD</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Trip Planner Page Component
        const TripPlannerPage = () => {
            const [formData, setFormData] = useState({
                destination: '',
                budget: '',
                dates: '',
                activities: '',
                preferences: ''
            });
            const [itinerary, setItinerary] = useState(null);

            const handleInputChange = (e) => {
                setFormData({
                    ...formData,
                    [e.target.name]: e.target.value
                });
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                // Mock itinerary generation
                setItinerary({
                    destination: formData.destination || "Tokyo, Japan",
                    duration: "7 days",
                    totalBudget: formData.budget || "$1,500",
                    highlights: [
                        "Day 1: Arrival and local cuisine experience",
                        "Day 2-3: Cultural landmarks and museums",
                        "Day 4-5: Nature and outdoor activities",
                        "Day 6: Shopping and local markets",
                        "Day 7: Departure preparation"
                    ],
                    recommendations: [
                        "Visit during weekdays for fewer crowds",
                        "Try local street food for authentic experience",
                        "Use public transportation for cost efficiency"
                    ]
                });
            };

            return (
                <div className="min-h-screen bg-white py-12">
                    <div className="container mx-auto px-4">
                        <div className="max-w-6xl mx-auto">
                            <h1 className="text-3xl font-bold text-gray-900 mb-2">Trip Planner</h1>
                            <p className="text-gray-600 mb-8">Describe your travel preferences and get an optimized itinerary</p>
                            
                            <div className="grid lg:grid-cols-2 gap-8">
                                {/* Trip Planning Form */}
                                <div className="bg-gray-50 p-6 rounded-xl border border-gray-200">
                                    <h2 className="text-xl font-semibold text-gray-900 mb-4">Your Travel Preferences</h2>
                                    <form onSubmit={handleSubmit} className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Destination
                                            </label>
                                            <input
                                                type="text"
                                                name="destination"
                                                value={formData.destination}
                                                onChange={handleInputChange}
                                                placeholder="Where do you want to go?"
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                            />
                                        </div>
                                        
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Budget
                                            </label>
                                            <input
                                                type="text"
                                                name="budget"
                                                value={formData.budget}
                                                onChange={handleInputChange}
                                                placeholder="Total budget for the trip"
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                            />
                                        </div>
                                        
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Travel Dates
                                            </label>
                                            <input
                                                type="text"
                                                name="dates"
                                                value={formData.dates}
                                                onChange={handleInputChange}
                                                placeholder="When are you planning to travel?"
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                            />
                                        </div>
                                        
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Preferred Activities
                                            </label>
                                            <textarea
                                                name="activities"
                                                value={formData.activities}
                                                onChange={handleInputChange}
                                                placeholder="What do you enjoy doing? (e.g., hiking, museums, food tours)"
                                                rows="3"
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                            />
                                        </div>
                                        
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Additional Preferences
                                            </label>
                                            <textarea
                                                name="preferences"
                                                value={formData.preferences}
                                                onChange={handleInputChange}
                                                placeholder="Any specific requirements or interests?"
                                                rows="2"
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                            />
                                        </div>
                                        
                                        <button
                                            type="submit"
                                            className="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors"
                                        >
                                            Generate Travel Plan
                                        </button>
                                    </form>
                                </div>
                                
                                {/* Itinerary Display */}
                                <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                                    <h2 className="text-xl font-semibold text-gray-900 mb-4">Recommended Itinerary</h2>
                                    
                                    {itinerary ? (
                                        <div className="space-y-6">
                                            <div className="bg-blue-50 p-4 rounded-lg">
                                                <h3 className="font-semibold text-blue-900 text-lg mb-2">{itinerary.destination}</h3>
                                                <div className="flex justify-between text-sm text-blue-800">
                                                    <span>Duration: {itinerary.duration}</span>
                                                    <span>Budget: {itinerary.totalBudget}</span>
                                                </div>
                                            </div>
                                            
                                            <div>
                                                <h4 className="font-semibold text-gray-900 mb-3">Trip Highlights</h4>
                                                <ul className="space-y-2">
                                                    {itinerary.highlights.map((highlight, index) => (
                                                        <li key={index} className="flex items-start">
                                                            <svg className="w-5 h-5 text-green-500 mr-2 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                                                            </svg>
                                                            <span className="text-gray-700">{highlight}</span>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>
                                            
                                            <div>
                                                <h4 className="font-semibold text-gray-900 mb-3">AI Recommendations</h4>
                                                <div className="bg-yellow-50 p-4 rounded-lg">
                                                    <ul className="space-y-2">
                                                        {itinerary.recommendations.map((rec, index) => (
                                                            <li key={index} className="text-yellow-800">• {rec}</li>
                                                        ))}
                                                    </ul>
                                                </div>
                                            </div>
                                            
                                            <button className="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition-colors">
                                                Save Itinerary
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="text-center py-12 text-gray-500">
                                            <svg className="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                            </svg>
                                            <p>Your personalized itinerary will appear here</p>
                                            <p className="text-sm">Fill out the form and generate your travel plan</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Image Analyzer Page Component
        const ImageAnalyzerPage = () => {
            const [selectedImage, setSelectedImage] = useState(null);
            const [analysisResult, setAnalysisResult] = useState(null);
            const [isAnalyzing, setIsAnalyzing] = useState(false);

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        setSelectedImage(e.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const analyzeImage = () => {
                if (!selectedImage) return;
                
                setIsAnalyzing(true);
                // Mock analysis delay
                setTimeout(() => {
                    setAnalysisResult({
                        culturalInsights: [
                            "This dish appears to be traditional Japanese ramen",
                            "The presentation suggests a high-quality restaurant",
                            "Ingredients include pork, bamboo shoots, and nori"
                        ],
                        recommendations: [
                            "Try similar dishes at local ramen shops",
                            "Visit during lunch hours for best experience",
                            "Consider taking a cooking class to learn preparation"
                        ],
                        estimatedCost: "$12-18 per bowl",
                        culturalSignificance: "Ramen is a popular Japanese comfort food with regional variations"
                    });
                    setIsAnalyzing(false);
                }, 2000);
            };

            return (
                <div className="min-h-screen bg-white py-12">
                    <div className="container mx-auto px-4">
                        <div className="max-w-4xl mx-auto">
                            <h1 className="text-3xl font-bold text-gray-900 mb-2">Image Analyzer</h1>
                            <p className="text-gray-600 mb-8">Upload travel or food photos for AI-powered analysis and insights</p>
                            
                            <div className="grid md:grid-cols-2 gap-8">
                                {/* Image Upload Section */}
                                <div className="bg-gray-50 p-6 rounded-xl border border-gray-200">
                                    <h2 className="text-xl font-semibold text-gray-900 mb-4">Upload Image</h2>
                                    
                                    <div className="space-y-4">
                                        <div className="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center">
                                            {selectedImage ? (
                                                <div className="space-y-4">
                                                    <img 
                                                        src={selectedImage} 
                                                        alt="Uploaded preview" 
                                                        className="mx-auto max-h-48 rounded-lg object-cover"
                                                    />
                                                    <button 
                                                        onClick={() => setSelectedImage(null)}
                                                        className="text-red-600 hover:text-red-700 text-sm"
                                                    >
                                                        Remove Image
                                                    </button>
                                                </div>
                                            ) : (
                                                <div className="text-gray-500">
                                                    <svg className="w-12 h-12 mx-auto mb-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                                    </svg>
                                                    <p className="mb-2">Drag and drop or click to upload</p>
                                                    <p className="text-sm">Supports JPG, PNG, WEBP</p>
                                                </div>
                                            )}
                                        </div>
                                        
                                        <div className="flex flex-col sm:flex-row gap-3">
                                            <label className="flex-1">
                                                <input
                                                    type="file"
                                                    accept="image/*"
                                                    onChange={handleImageUpload}
                                                    className="hidden"
                                                />
                                                <div className="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold text-center hover:bg-blue-700 transition-colors cursor-pointer">
                                                    Choose File
                                                </div>
                                            </label>
                                            
                                            <label className="flex-1">
                                                <input
                                                    type="file"
                                                    accept="image/*"
                                                    capture="camera"
                                                    onChange={handleImageUpload}
                                                    className="hidden"
                                                />
                                                <div className="w-full bg-green-600 text-white py-3 rounded-lg font-semibold text-center hover:bg-green-700 transition-colors cursor-pointer">
                                                    Take Photo
                                                </div>
                                            </label>
                                        </div>
                                        
                                        <button
                                            onClick={analyzeImage}
                                            disabled={!selectedImage || isAnalyzing}
                                            className={`w-full py-3 rounded-lg font-semibold transition-colors ${
                                                !selectedImage || isAnalyzing 
                                                    ? 'bg-gray-400 cursor-not-allowed' 
                                                    : 'bg-blue-600 hover:bg-blue-700 text-white'
                                            }`}
                                        >
                                            {isAnalyzing ? 'Analyzing...' : 'Analyze Image'}
                                        </button>
                                    </div>
                                </div>
                                
                                {/* Analysis Results */}
                                <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                                    <h2 className="text-xl font-semibold text-gray-900 mb-4">AI Analysis Results</h2>
                                    
                                    {isAnalyzing ? (
                                        <div className="text-center py-12">
                                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
                                            <p className="text-gray-600">Analyzing your image...</p>
                                        </div>
                                    ) : analysisResult ? (
                                        <div className="space-y-6">
                                            <div className="bg-blue-50 p-4 rounded-lg">
                                                <h3 className="font-semibold text-blue-900 mb-3">Cultural Insights</h3>
                                                <ul className="space-y-2">
                                                    {analysisResult.culturalInsights.map((insight, index) => (
                                                        <li key={index} className="text-blue-800 flex items-start">
                                                            <svg className="w-5 h-5 text-blue-600 mr-2 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                            </svg>
                                                            {insight}
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>
                                            
                                            <div className="bg-green-50 p-4 rounded-lg">
                                                <h3 className="font-semibold text-green-900 mb-3">Recommendations</h3>
                                                <ul className="space-y-2">
                                                    {analysisResult.recommendations.map((rec, index) => (
                                                        <li key={index} className="text-green-800 flex items-start">
                                                            <svg className="w-5 h-5 text-green-600 mr-2 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                            </svg>
                                                            {rec}
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>
                                            
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="bg-yellow-50 p-4 rounded-lg">
                                                    <h4 className="font-semibold text-yellow-900 text-sm mb-1">Estimated Cost</h4>
                                                    <p className="text-yellow-800">{analysisResult.estimatedCost}</p>
                                                </div>
                                                <div className="bg-purple-50 p-4 rounded-lg">
                                                    <h4 className="font-semibold text-purple-900 text-sm mb-1">Cultural Significance</h4>
                                                    <p className="text-purple-800 text-sm">{analysisResult.culturalSignificance}</p>
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="text-center py-12 text-gray-500">
                                            <svg className="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                                            </svg>
                                            <p>Upload an image to get AI analysis</p>
                                            <p className="text-sm">Supports travel photos, food images, and cultural scenes</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');

            const renderPage = () => {
                switch (currentPage) {
                    case 'home':
                        return <HomePage setCurrentPage={setCurrentPage} />;
                    case 'exchange':
                        return <ExchangeRatePage />;
                    case 'planner':
                        return <TripPlannerPage />;
                    case 'analyzer':
                        return <ImageAnalyzerPage />;
                    default:
                        return <HomePage setCurrentPage={setCurrentPage} />;
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <Navigation currentPage={currentPage} setCurrentPage={setCurrentPage} />
                    <main className="flex-1">
                        {renderPage()}
                    </main>
                    <Footer />
                </div>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
