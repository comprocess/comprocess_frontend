        const [selectedImage, setSelectedImage] = useState(null);

        const [isAnalyzing, setIsAnalyzing] = useState(false);

        const handleImageUpload = (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
              setSelectedImage(e.target.result);
            };
            reader.readAsDataURL(file);
          }
        };

        const analyzeImage = () => {
          if (!selectedImage) return;

          setIsAnalyzing(true);
          // Mock analysis delay
          setTimeout(() => {
            setAnalysisResult({
              culturalInsights: [
                "This dish appears to be traditional Japanese ramen",
                "The presentation suggests a high-quality restaurant",
                "Ingredients include pork, bamboo shoots, and nori",
              ],
              recommendations: [
                "Try similar dishes at local ramen shops",
                "Visit during lunch hours for best experience",
                "Consider taking a cooking class to learn preparation",
              ],
              estimatedCost: "$12-18 per bowl",
              culturalSignificance:
                "Ramen is a popular Japanese comfort food with regional variations",
            });
            setIsAnalyzing(false);

        return (
          <div className="min-h-screen bg-white py-12">

                    </h2>

                    <div className="space-y-4">
                      <div className="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center">
                        {selectedImage ? (
                          <div className="space-y-4">
                            <img
                              src={selectedImage}
                              alt="Uploaded preview"
                              className="mx-auto max-h-48 rounded-lg object-cover"
                            />
                            <button
                              onClick={() => setSelectedImage(null)}
                              className="text-red-600 hover:text-red-700 text-sm"
                            >
                              Remove Image
                            </button>
                          </div>
                        ) : (
                          <div className="text-gray-500">
                            <svg
                              className="w-12 h-12 mx-auto mb-4 text-gray-400"
                              fill="none"
                              stroke="currentColor"
                              viewBox="0 0 24 24"
                            >
                              <path
                                strokeLinecap="round"
                                strokeLinejoin="round"
                                strokeWidth={2}
                                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
                              />
                            </svg>
                            <p className="mb-2">
                              Drag and drop or click to upload
                            </p>
                            <p className="text-sm">Supports JPG, PNG, WEBP</p>
                          </div>
                        )}
                      </div>

                      <div className="flex flex-col sm:flex-row gap-3">
                        <label className="flex-1">
                          <input
                            type="file"
                            accept="image/*"
                            onChange={handleImageUpload}
                            className="hidden"
                          />
                          <div className="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold text-center hover:bg-blue-700 transition-colors cursor-pointer">
                            Choose File
                          </div>
                        </label>

                        <label className="flex-1">
                          <input
                            type="file"
                            accept="image/*"
                            capture="camera"
                            onChange={handleImageUpload}
                            className="hidden"
                          />
                          <div className="w-full bg-green-600 text-white py-3 rounded-lg font-semibold text-center hover:bg-green-700 transition-colors cursor-pointer">
                            Take Photo
                          </div>
                        </label>
                      </div>

                      <button
                        onClick={analyzeImage}
                        disabled={!selectedImage || isAnalyzing}
                        className={`w-full py-3 rounded-lg font-semibold transition-colors ${
                          !selectedImage || isAnalyzing
                            ? "bg-gray-400 cursor-not-allowed"
                            : "bg-blue-600 hover:bg-blue-700 text-white"
                        }`}
                      >
                        {isAnalyzing ? "Analyzing..." : "Analyze Image"}
                      </button>
                    </div>
                  </div>

                  {/* Analysis Results */}
                  <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                    <h2 className="text-xl font-semibold text-gray-900 mb-4">
                      AI Analysis Results
                    </h2>

                    {isAnalyzing ? (
                      <div className="text-center py-12">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
                        <p className="text-gray-600">Analyzing your image...</p>
                      </div>
                    ) : analysisResult ? (
                      <div className="space-y-6">
                        <div className="bg-blue-50 p-4 rounded-lg">
                          <h3 className="font-semibold text-blue-900 mb-3">
                            Cultural Insights
                          </h3>
                          <ul className="space-y-2">
                            {analysisResult.culturalInsights.map(
                              (insight, index) => (
                                <li
                                  key={index}
                                  className="text-blue-800 flex items-start"
                                >
                                  <svg
                                    className="w-5 h-5 text-blue-600 mr-2 mt-0.5 flex-shrink-0"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                  >
                                    <path
                                      strokeLinecap="round"
                                      strokeLinejoin="round"
                                      strokeWidth={2}
                                      d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                                    />
                                  </svg>
                                  {insight}
                                </li>
                              )
                            )}
                          </ul>
                        </div>

                        <div className="bg-green-50 p-4 rounded-lg">
                          <h3 className="font-semibold text-green-900 mb-3">
                            Recommendations
                          </h3>
                          <ul className="space-y-2">
                            {analysisResult.recommendations.map(
                              (rec, index) => (
                                <li
                                  key={index}
                                  className="text-green-800 flex items-start"
                                >
                                  <svg
                                    className="w-5 h-5 text-green-600 mr-2 mt-0.5 flex-shrink-0"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                  >
                                    <path
                                      strokeLinecap="round"
                                      strokeLinejoin="round"
                                      strokeWidth={2}
                                      d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
                                    />
                                  </svg>
                                  {rec}
                                </li>
                              )
                            )}
                          </ul>
                        </div>

                        <div className="grid grid-cols-2 gap-4">
                          <div className="bg-yellow-50 p-4 rounded-lg">
                            <h4 className="font-semibold text-yellow-900 text-sm mb-1">
                              Estimated Cost
                            </h4>
                            <p className="text-yellow-800">
                              {analysisResult.estimatedCost}
                            </p>
                          </div>
                          <div className="bg-purple-50 p-4 rounded-lg">
                            <h4 className="font-semibold text-purple-900 text-sm mb-1">
                              Cultural Significance
                            </h4>
                            <p className="text-purple-800 text-sm">
                              {analysisResult.culturalSignificance}
                            </p>
                          </div>
                        </div>
                      </div>
                    ) : (
                      <div className="text-center py-12 text-gray-500">
                        <svg
                          className="w-16 h-16 mx-auto mb-4 text-gray-300"
                          fill="none"
                          stroke="currentColor"
                          viewBox="0 0 24 24"
                        >
                          <path
                            strokeLinecap="round"
                            strokeLinejoin="round"
                            strokeWidth={2}
                            d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"
                          />
                        </svg>
                        <p>Upload an image to get AI analysis</p>
                        <p className="text-sm">
                          Supports travel photos, food images, and cultural
                          scenes
                        </p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      };

      // Main App Component
      const App = () => {
        const [currentPage, setCurrentPage] = useState("home");

        const renderPage = () => {
          switch (currentPage) {
            case "home":
              return <HomePage setCurrentPage={setCurrentPage} />;
            case "exchange":
              return <ExchangeRatePage />;
            case "planner":
              return <TripPlannerPage />;
            case "analyzer":
              return <ImageAnalyzerPage />;
            default:
              return <HomePage setCurrentPage={setCurrentPage} />;
          }
        };

        return (
          <div className="min-h-screen flex flex-col">
            <Navigation
              currentPage={currentPage}
              setCurrentPage={setCurrentPage}
            />
            <main className="flex-1">{renderPage()}</main>
            <Footer />
          </div>
        );
      };

      // Render the app
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
